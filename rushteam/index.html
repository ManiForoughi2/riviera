<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rush team | FIJI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120d26">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<style>
@font-face { font-family: "Recia"; src: url("../assets/fonts/recia-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Recia"; src: url("../assets/fonts/recia-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root {
  --bg: #120d26; --bg2: #1a1435; --card: #1f1840; --line: rgba(236, 220, 194, .14);
  --ink: #ecdcc2; --ink2: rgba(236, 220, 194, .74); --ink3: rgba(236, 220, 194, .5);
  --accent: #cdb8f0; --purple: #6a3fa8; --purple-hi: #b89ae6; --ok: #9fd8a8; --bad: #f2a3a3;
  --serif: "Recia", Georgia, serif; --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --g: max(16px, env(safe-area-inset-left));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; min-height: 100svh; background: linear-gradient(180deg, var(--bg2), var(--bg) 40%); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px;
  border: 0; border-radius: 10px; cursor: pointer; font: 600 14px/1 var(--serif); letter-spacing: .1em; text-transform: uppercase;
  color: #f6efe3; background: linear-gradient(170deg, #9d7cd2 0%, #7650b3 30%, #5a3093 68%, #3d1c6b 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 3px rgba(0,0,0,.3);
}
.btn:disabled { opacity: .6; }
.field { width: 100%; padding: 12px 14px; border: 0; border-radius: 10px; background: rgba(236,220,194,.08); box-shadow: inset 0 0 0 1px var(--line); }
.field:focus { outline: 2px solid var(--purple-hi); outline-offset: 1px; }
textarea.field { resize: vertical; min-height: 84px; line-height: 1.4; }

/* the door */
.gate { min-height: 100svh; display: grid; place-items: center; padding: 24px var(--g); }
.gate form { width: min(380px, 100%); display: grid; gap: 14px; text-align: center; }
.gate h1 { margin: 0 0 6px; font: 500 clamp(40px, 9vw, 60px)/1 var(--serif); letter-spacing: -.01em; }
.gate p { margin: 0 0 10px; color: var(--ink2); }
.gate .msg { min-height: 1.4em; color: var(--bad); font-weight: 600; }

/* who are you */
.pick { min-height: 100svh; padding: calc(env(safe-area-inset-top) + 40px) var(--g) 40px; }
.pick-in { max-width: 900px; margin: 0 auto; }
.pick h1 { margin: 0 0 6px; font: 500 clamp(34px, 7vw, 52px)/1.05 var(--serif); }
.pick-in > p { margin: 0 0 26px; color: var(--ink2); }
.pick-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 22px; }
.pick-group h2 { margin: 0 0 10px; font: 600 13px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.pick-group ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.pick-group button { width: 100%; min-height: 48px; padding: 0 16px; border: 0; border-radius: 10px; text-align: left; cursor: pointer; font-weight: 600; background: rgba(236,220,194,.07); box-shadow: inset 0 0 0 1px var(--line); }
.pick-group button:hover { background: rgba(150,110,210,.25); }

/* adding a kid */
.add-btn { min-height: 42px; padding: 0 14px; font-size: 12px; }
.btn.ghost { background: rgba(236,220,194,.08); box-shadow: inset 0 0 0 1px var(--line); }
dialog.add { width: min(460px, calc(100vw - 24px)); max-height: calc(100svh - 24px); padding: 0; border: 0; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px var(--line); }
dialog.add::backdrop { background: rgba(8, 5, 20, .7); }
.add form { display: grid; gap: 12px; padding: 22px; }
.add h2 { margin: 0; font: 500 28px/1.1 var(--serif); }
.add-note { margin: 0 0 4px; font-size: 14px; color: var(--ink2); }
.add label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.add-warn { margin: 4px 0 6px; font-weight: 700; color: #f0c27a; }
.add-matches ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.add-matches li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(236,220,194,.06); font-size: 14px; }
.add-matches li small { color: var(--ink3); }
.add-matches li button { flex: none; min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; background: var(--purple); color: #fff; }
.add-msg { min-height: 1.2em; margin: 0; font-size: 14px; font-weight: 600; color: var(--accent); }
.add-actions { display: flex; justify-content: flex-end; gap: 10px; }
.new-tag { margin: 6px 0 0 6px; display: inline-block; padding: 3px 8px; border-radius: 6px; font: 600 12px/1.2 var(--body); color: #fff; background: var(--purple); }
@media (max-width: 560px) { .add-row { grid-template-columns: 1fr; } }

/* the board */
.top { position: sticky; top: 0; z-index: 5; padding: calc(env(safe-area-inset-top) + 12px) var(--g) 12px; background: rgba(18, 13, 38, .92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-row { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font: 600 20px/1 var(--serif); letter-spacing: .08em; margin-right: auto; }
.brand small { margin-left: 8px; font: 500 14px/1 var(--body); letter-spacing: 0; color: var(--ink3); }
.who { display: flex; align-items: center; gap: 8px; }
.who select { min-height: 42px; padding: 0 12px; border-radius: 10px; border: 0; background: rgba(236,220,194,.08); box-shadow: inset 0 0 0 1px var(--line); }
.filters { max-width: 1180px; margin: 12px auto 0; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(236,220,194,.07); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: none; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--purple); color: #fff; }
.search { flex: 1 1 200px; min-height: 42px; }
.count { font-size: 14px; color: var(--ink3); white-space: nowrap; }
main { max-width: 1180px; margin: 0 auto; padding: 18px var(--g) 60px; }
.hint { margin: 0 0 16px; color: var(--ink3); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px 14px; padding: 14px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.card.done { box-shadow: inset 0 0 0 1px rgba(159, 216, 168, .35); }
.pic { position: relative; width: 96px; height: 120px; border-radius: 10px; overflow: hidden; background: rgba(236,220,194,.06); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--ink3); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pic input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pic .up { padding: 8px; line-height: 1.25; }
.pic.busy::after { content: "Uploading…"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(18,13,38,.7); color: var(--ink); font-size: 12px; }
.head { min-width: 0; }
.name { margin: 0; font: 500 21px/1.15 var(--serif); }
.meta { margin: 4px 0 0; font-size: 13px; color: var(--ink3); }
.stars { display: flex; gap: 2px; margin-top: 8px; }
.stars button { width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 21px; line-height: 1; color: rgba(236,220,194,.25); }
.stars button.on { color: #e9c46a; }
.body { grid-column: 1 / -1; display: grid; gap: 8px; }
.ig { display: flex; gap: 8px; align-items: center; }
.ig .field { min-width: 0; }
.ig a { flex: none; font-size: 13px; font-weight: 600; text-decoration: none; }
.state { min-height: 1.2em; font-size: 12px; color: var(--ink3); }
.state.saved { color: var(--ok); }
.state.err { color: var(--bad); }
.empty { padding: 40px 0; text-align: center; color: var(--ink3); }
.sort { flex: 0 0 auto; width: auto; min-height: 42px; padding: 0 12px; }
.section { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; margin: 10px 0 0; font: 500 26px/1.1 var(--serif); }
.section:first-child { margin-top: 0; }
.section span { font: 600 14px/1 var(--body); color: var(--ink3); }
.more { grid-column: 1 / -1; display: grid; justify-items: start; gap: 10px; padding: 26px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px rgba(159, 216, 168, .35); }
.more p { margin: 0; color: var(--ink2); }
.more .more-head { font: 500 26px/1.15 var(--serif); color: var(--ink); }
.more-btn { grid-column: 1 / -1; justify-self: center; }
.section.done-head { margin-top: 26px; color: var(--ink2); }
.noig { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); cursor: pointer; }
.noig input { width: 18px; height: 18px; accent-color: var(--purple); }
.ig .field:disabled { opacity: .45; }
.official { margin: 0; display: grid; gap: 2px; font-size: 14px; color: var(--ink2); }
.frat-tag { margin: 6px 0 0; display: inline-block; padding: 3px 8px; border-radius: 6px; font: 600 12px/1.2 var(--body); color: #1a1435; background: #f0c27a; }
.frat-tag:empty { display: none; }
.priv-tag { margin: 6px 0 0 6px; display: inline-block; padding: 3px 8px; border-radius: 6px; font: 600 12px/1.2 var(--body); color: #1a1435; background: #b9c7e8; }
.priv-tag:empty { display: none; }
.official-line:first-child { color: var(--ink); }
.official:empty { display: none; }
.official a { font-weight: 600; text-decoration: none; }
.official span { color: var(--ink3); font-size: 12px; }
.score { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--ink3); }
.score b { font: 600 20px/1 var(--serif); color: #e9c46a; }
.mine-label { font: 600 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.others { font-size: 14px; }
.others summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.others ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.others li { padding: 8px 10px; border-radius: 8px; background: rgba(236,220,194,.05); }
.others li b { color: var(--ink); }
.others .st { color: #e9c46a; margin-left: 6px; }
.others p { margin: 4px 0 0; color: var(--ink2); white-space: pre-wrap; }
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr; }
  .brand small { display: none; }
}
</style>
</head>
<body>

<section class="gate" id="gate">
  <form id="gate-form">
    <h1>Rush team</h1>
    <p>FIJI, Alpha Sigma Chapter</p>
    <label class="sr" for="pw">Password</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit">Enter</button>
    <p class="msg" id="gate-msg" role="alert"></p>
  </form>
</section>

<section class="pick" id="pick" hidden>
  <div class="pick-in">
    <h1>Who are you?</h1>
    <p>Pick your name to see the kids assigned to you.</p>
    <div class="pick-groups" id="pick-groups"></div>
  </div>
</section>

<dialog class="add" id="add">
  <form id="add-form" method="dialog" novalidate>
    <h2>Add a kid</h2>
    <p class="add-note">For someone who isn't on the list yet. He goes to the group with the fewest kids.</p>
    <div class="add-row">
      <label><span>First name</span><input class="field" name="first" autocomplete="off" autocapitalize="words" required></label>
      <label><span>Last name</span><input class="field" name="last" autocomplete="off" autocapitalize="words" required></label>
    </div>
    <label><span>Instagram (optional)</span><input class="field" name="ig" autocomplete="off" autocapitalize="off"></label>
    <div class="add-matches" id="add-matches" hidden>
      <p class="add-warn">Is he already on the list?</p>
      <ul id="add-list"></ul>
    </div>
    <p class="add-msg" id="add-msg" role="status"></p>
    <div class="add-actions">
      <button class="btn ghost" type="button" id="add-cancel">Cancel</button>
      <button class="btn" type="submit" id="add-go">Check and add</button>
    </div>
  </form>
</dialog>

<div id="board" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand">FIJI RUSH <small>Spring &#39;27</small></div>
      <button class="btn add-btn" type="button" id="add-open">+ Add kid</button>
      <label class="who"><span class="sr">I am</span><select id="me"><option value="">Switch person…</option></select></label>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-view="rate" aria-pressed="true">Rate</button>
        <button type="button" data-view="group" aria-pressed="false">My group</button>
        <button type="button" data-view="all" aria-pressed="false">Everyone</button>
      </div>
      <div class="seg sub" id="sub" role="group" aria-label="Rate">
        <button type="button" data-sub="todo" aria-pressed="true">To do</button>
        <button type="button" data-sub="done" aria-pressed="false">Reviewed</button>
      </div>
      <input class="field search" id="q" type="search" placeholder="Search a name" autocomplete="off">
      <select class="field sort" id="sort" aria-label="Sort"><option value="shuffle">Shuffled</option><option value="high" selected>Highest score</option><option value="az">A to Z</option><option value="low">Lowest score</option><option value="most">Most ratings</option><option value="fewest">Fewest ratings</option></select>
      <span class="count" id="count"></span>
    </div>
  </header>
  <main>
    <p class="hint" id="hint"></p>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
(() => {
  const API = "https://asufiji-rush.maniforoughi2.workers.dev";
  const $ = (q) => document.querySelector(q);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
  let token = store.get("rush-token"), roster = null, notes = {}, ratings = {}, view = "rate", sub = "todo", synced = 0, extra = 0;
  const NONE = "__none__";
  // a pasted link, "@Name" or " name " all become "name" (the worker cleans it the same way)
  const cleanHandle = (v) => String(v || "").trim().replace(/^(https?:\/\/)?((www|m)\.)?(instagram\.com|instagr\.am)\//i, "").replace(/^@/, "").replace(/[/?#].*$/, "").toLowerCase().replace(/[^a-z0-9._]/g, "").slice(0, 30);

  const call = async (path, opts = {}) => {
    const r = await fetch(API + path, { ...opts, headers: { authorization: "Bearer " + token, ...(opts.headers || {}) } });
    if (r.status === 401) { store.del("rush-token"); location.reload(); throw new Error("signed out"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "failed");
    return j;
  };
  const me = () => $("#me").value;
  const groupOf = (name) => roster.groups.find((g) => g.members.includes(name));
  // a PNM's score: the average of every rating given to him, and how many of his group rated him
  const score = (p) => {
    const rs = (ratings[p.id] || []).filter((r) => r.rating > 0);
    const size = roster.groups.find((g) => g.n === p.group)?.members.length || 0;
    return { avg: rs.length ? rs.reduce((t, r) => t + r.rating, 0) / rs.length : 0, n: rs.length, size };
  };
  const mineOf = (p) => (ratings[p.id] || []).find((r) => r.by === me());
  // the official handle: the one most brothers entered (ties go to whoever entered it first). if nobody
  // found one and someone ticked "can't find", the card says so
  const official = (p) => {
    const tally = new Map(); let none = 0;
    for (const r of [...(ratings[p.id] || [])].sort((a, b) => a.at - b.at)) {
      if (!r.ig) continue;
      if (r.ig === NONE) { none++; continue; }
      tally.set(r.ig, (tally.get(r.ig) || 0) + 1);
    }
    // most votes first: when two brothers found different accounts, both show, as separate people
    return { list: [...tally.entries()].sort((a, b) => b[1] - a[1]), none };
  };

  // ---------- the door ----------
  $("#gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; $("#gate-msg").textContent = "";
    try {
      const r = await fetch(API + "/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("#pw").value.trim() }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "failed");
      token = j.token; store.set("rush-token", token); open();
    } catch (err) {
      $("#gate-msg").textContent = err.message === "wrong password" ? "Wrong password." : "Couldn't reach the server. Check your connection, or turn off any content blocker for this site, and try again.";
    }
    btn.disabled = false;
  });

  // ---------- who are you, then the board ----------
  async function open() {
    const d = await call("/data");
    roster = d.roster; notes = d.notes || {}; ratings = d.ratings || {}; synced = d.now || Date.now();
    roster.pnms = [...roster.pnms, ...(d.added || [])];
    $("#gate").hidden = true;
    const sel = $("#me");
    $("#pick-groups").replaceChildren(...roster.groups.map((g) => {
      const box = document.createElement("div"); box.className = "pick-group";
      box.innerHTML = `<h2>Group ${g.n}</h2><ul></ul>`;
      for (const m of g.members) {
        const li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.textContent = m;
        b.addEventListener("click", () => { store.set("rush-me", m); sel.value = m; $("#pick").hidden = true; $("#board").hidden = false; setView("rate"); scrollTo(0, 0); });
        li.append(b); box.querySelector("ul").append(li);
      }
      const og = document.createElement("optgroup"); og.label = "Group " + g.n;
      for (const m of g.members) { const o = document.createElement("option"); o.value = m; o.textContent = m; og.append(o); }
      sel.append(og);
      return box;
    }));
    sel.value = store.get("rush-me") || "";
    if (sel.value) $("#board").hidden = false; else $("#pick").hidden = false;
    sel.addEventListener("change", () => {
      if (!sel.value) { $("#board").hidden = true; $("#pick").hidden = false; store.del("rush-me"); scrollTo(0, 0); return; }
      store.set("rush-me", sel.value); setView("rate");
    });
    document.querySelectorAll(".seg button[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
    document.querySelectorAll(".seg button[data-sub]").forEach((b) => b.addEventListener("click", () => setSub(b.dataset.sub)));
    $("#q").addEventListener("input", draw);
    $("#sort").addEventListener("change", draw);
    setView("rate");
  }
  function setSub(v) {
    sub = v;
    $("#sort").value = v === "todo" ? "shuffle" : "high";
    document.querySelectorAll(".seg button[data-sub]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sub === v)));
    draw(); scrollTo(0, 0);
  }
  function setView(v) {
    view = v;
    $("#sub").hidden = v !== "rate";
    $("#sort").value = v === "rate" && sub === "todo" ? "shuffle" : "high";
    document.querySelectorAll(".seg button[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    draw();
  }

  function shown() {
    const g = groupOf(me())?.n, q = $("#q").value.trim().toLowerCase();
    let list = roster.pnms.filter((p) => !gone(p));
    if (view === "rate") list = list.filter((p) => p.group === g);
    else if (view === "group") list = list.filter((p) => p.group === g);
    if (q) list = list.filter((p) => (p.first + " " + p.last).toLowerCase().includes(q));
    const sort = $("#sort").value, by = {
      // each brother gets his own order, the same every time he opens it, with kids nobody has rated
      // yet first: a group of six starts on six different kids instead of all at the top
      shuffle: (a, b) => score(a).n - score(b).n || mix(a.id) - mix(b.id),
      high: (a, b) => score(b).avg - score(a).avg || score(b).n - score(a).n,
      low: (a, b) => (score(a).n ? score(a).avg : 9) - (score(b).n ? score(b).avg : 9),
      most: (a, b) => score(b).n - score(a).n,
      fewest: (a, b) => score(a).n - score(b).n,
    }[sort];
    return by ? [...list].sort(by) : list;
  }
  // what makes a kid "done" in each list: rated by you, or his photo and Instagram found (or known to be missing)

  // done for you: you rated him, or you looked and couldn't find his Instagram
  const finished = (p) => { const m = mineOf(p); return !!(m?.rating || m?.ig === NONE || m?.frat || m?.priv); };
  const privCount = (p) => (ratings[p.id] || []).filter((r) => r.priv).length;
  const mix = (id) => { let h = 2166136261; for (const ch of me() + "|" + id) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
  const fratCount = (p) => (ratings[p.id] || []).filter((r) => r.frat).length;
  // three or more brothers saying he's already in a frat takes him off every list
  const OUT = 3, gone = (p) => fratCount(p) >= OUT;
  function counts(list) {
    const out = roster.pnms.filter(gone).length, tail = out ? ` · ${out} removed (in a frat)` : "";
    return countsOf(list) + tail;
  }
  function countsOf(list) {
    if (view === "rate") return `${list.filter(finished).length} of ${list.length} done`;
    if (view === "group") return `${list.length} kids · ${list.filter((p) => score(p).n).length} rated`;
    return `${list.length} kids · ${list.filter((p) => score(p).n).length} rated`;
  }
  const HINTS = {
    rate: "Everyone in your group rates every kid in your group. Tap the stars and write your first thoughts; they save by themselves. Reviewed kids move to the Reviewed tab the next time the list loads. No photo yet? Add one if you can find him on Instagram; everyone sees it.",
    group: "Your group's kids with everyone's ratings. Sort by highest score to see where they stand.",
    all: "Every kid, with his average score from his group.",
  };
  function draw() {
    const list = shown();
    $("#hint").textContent = HINTS[view];
    $("#count").textContent = counts(list);
    const grid = $("#grid");
    if (!list.length) { grid.innerHTML = `<p class="empty">Nobody matches.</p>`; return; }
    if (view !== "rate") { grid.replaceChildren(...list.map(card)); return; }
    // the Rate tab: "To do" (what you haven't reviewed) or "Reviewed" (what you have, other groups' too)
    const g = groupOf(me())?.n, q = $("#q").value.trim().toLowerCase();
    const match = (p) => !q || (p.first + " " + p.last).toLowerCase().includes(q);
    const todo = list.filter((p) => !finished(p));
    const done = [...list.filter(finished), ...roster.pnms.filter((p) => p.group !== g && !gone(p) && match(p) && finished(p))];
    document.querySelector('[data-sub="todo"]').textContent = `To do (${todo.length})`;
    document.querySelector('[data-sub="done"]').textContent = `Reviewed (${done.length})`;
    if (sub === "done") {
      grid.replaceChildren(...done.map(card));
      if (!done.length) grid.innerHTML = `<p class="empty">You haven't reviewed anyone yet.</p>`;
      return;
    }
    grid.replaceChildren(...todo.map(card));
    if (todo.length) return;
    // finished your own group: offer the kids in other groups with the fewest ratings, unrated first
    const others = roster.pnms.filter((p) => p.group !== g && !gone(p) && match(p) && !finished(p))
      .sort((a, b) => score(a).n - score(b).n || mix(a.id) - mix(b.id));
    if (!extra) {
      const box = document.createElement("div"); box.className = "more";
      box.innerHTML = `<p class="more-head">All done with your group. Nice.</p><p>Want to rate more? You'll get kids from other groups that have the fewest ratings.</p>`;
      const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Rate more kids";
      b.disabled = !others.length;
      b.addEventListener("click", () => { extra = 20; draw(); scrollTo(0, 0); });
      box.append(b);
      if (!others.length) box.querySelector("p:last-of-type").textContent = "Every kid has been reviewed. That's everyone.";
      grid.replaceChildren(box);
      return;
    }
    const head = document.createElement("h2"); head.className = "section";
    head.innerHTML = `Extra kids <span>from other groups, fewest ratings first</span>`;
    const more = document.createElement("button"); more.className = "btn ghost more-btn"; more.type = "button"; more.textContent = "Show 20 more";
    more.addEventListener("click", () => { extra += 20; draw(); });
    grid.replaceChildren(head, ...others.slice(0, extra).map(card), ...(others.length > extra ? [more] : []));
    if (!others.length) grid.innerHTML = `<p class="empty">Every kid has been reviewed. That's everyone.</p>`;
  }
  const refreshCount = () => { $("#count").textContent = counts(shown()); };

  function card(p) {
    const n = notes[p.id] || {}, mine = mineOf(p) || {};
    const el = document.createElement("article");
    el.className = "card" + (finished(p) ? " done" : "");
    el.innerHTML = `
      <label class="pic"><span class="up">+ Add photo</span><input type="file" accept="image/*"></label>
      <div class="head">
        <h2 class="name"></h2>
        <p class="meta"></p>
        <p class="score"></p>
        <p class="frat-tag"></p>
        <p class="priv-tag"></p>
      </div>
      <div class="body">
        <span class="mine-label">Your rating</span>
        <div class="stars" role="group" aria-label="Your rating">${[1, 2, 3, 4, 5].map((i) => `<button type="button" data-r="${i}" aria-label="${i} of 5">★</button>`).join("")}</div>
        <textarea class="field" name="thoughts" maxlength="1500" placeholder="Your first thoughts"></textarea>
        <div class="ig"><input class="field" name="ig" placeholder="His Instagram handle" autocomplete="off" autocapitalize="off"><a target="_blank" rel="noopener" hidden>Open</a></div>
        <p class="official"></p>
        <label class="noig"><input type="checkbox" name="noig"> Can't find Instagram</label>
        <label class="noig"><input type="checkbox" name="priv"> Private account</label>
        <label class="noig"><input type="checkbox" name="frat"> Already in a frat</label>
        <details class="others"><summary></summary><ul></ul></details>
        <p class="state" aria-live="polite"></p>
      </div>`;
    el.querySelector(".name").textContent = `${p.first} ${p.last}`;
    el.querySelector(".meta").textContent = `Group ${p.group}`;
    if (p.added) { const t = document.createElement("span"); t.className = "new-tag"; t.textContent = "Added by " + (p.by || "a brother"); el.querySelector(".head").append(t); }
    el.querySelector(".pic input").setAttribute("aria-label", `Photo of ${p.first} ${p.last}`);
    const th = el.querySelector('[name="thoughts"]'), ig = el.querySelector('[name="ig"]'), link = el.querySelector(".ig a"), state = el.querySelector(".state");
    const stars = [...el.querySelectorAll(".stars button")];
    const paint = (r) => stars.forEach((b) => b.classList.toggle("on", +b.dataset.r <= r));
    th.value = mine.thoughts || ""; paint(mine.rating || 0);
    const noig = el.querySelector('[name="noig"]'), frat = el.querySelector('[name="frat"]');
    frat.checked = !!mine.frat;
    frat.addEventListener("change", () => rate({ frat: frat.checked ? 1 : 0 }));
    const priv = el.querySelector('[name="priv"]');
    priv.checked = !!mine.priv;
    priv.addEventListener("change", () => rate({ priv: priv.checked ? 1 : 0 }));
    noig.checked = mine.ig === NONE; ig.disabled = noig.checked;
    ig.value = mine.ig && mine.ig !== NONE ? mine.ig : "";
    const drawOfficial = () => {
      // a handle two or more brothers entered is the assumed one; one-off entries are listed under it
      const o = official(p), box = el.querySelector(".official");
      const link = ([h, c]) => {
        const a = document.createElement("a"); a.target = "_blank"; a.rel = "noopener";
        a.href = "https://www.instagram.com/" + encodeURIComponent(h) + "/"; a.textContent = "@" + h;
        const n = document.createElement("span"); n.textContent = ` (${c})`;
        return [a, n];
      };
      const line = (label, items) => {
        const l = document.createElement("span"); l.className = "official-line"; l.append(label);
        items.forEach((it, i) => { if (i) l.append(" · "); l.append(...link(it)); });
        return l;
      };
      const sure = o.list.filter(([, c]) => c >= 2), once = o.list.filter(([, c]) => c < 2);
      box.replaceChildren(
        ...(sure.length ? [line("Assumed insta handle: ", sure)] : []),
        ...(once.length ? [line(sure.length ? "Also entered: " : "Entered: ", once)] : []),
      );
      if (!o.list.length && o.none) box.textContent = "Instagram: couldn't find it";
    };
    drawOfficial();
    const showLink = () => { const h = cleanHandle(ig.value); link.hidden = !h || noig.checked; link.href = "https://www.instagram.com/" + encodeURIComponent(h) + "/"; };
    showLink();
    const drawScore = () => {
      const sc = score(p), fc = fratCount(p);
      el.classList.toggle("in-frat", fc > 0);
      el.querySelector(".frat-tag").textContent = fc ? `In a frat (${fc})` : "";
      const pc = privCount(p);
      el.querySelector(".priv-tag").textContent = pc ? `Private account (${pc})` : "";
      el.querySelector(".score").innerHTML = sc.n ? `<b>${sc.avg.toFixed(1)}</b> ★ · ${sc.n > sc.size ? sc.n + " rated" : `${sc.n} of ${sc.size} rated`}` : "Not rated yet";
      const others = (ratings[p.id] || []).filter((r) => r.by !== me());
      const det = el.querySelector(".others");
      det.hidden = !others.length;
      det.querySelector("summary").textContent = `What others said (${others.length})`;
      det.querySelector("ul").replaceChildren(...others.map((r) => {
        const li = document.createElement("li");
        li.innerHTML = `<b></b><span class="st"></span><p></p>`;
        li.querySelector("b").textContent = r.by + (r.ig && r.ig !== NONE ? ` · @${r.ig}` : "");
        li.querySelector(".st").textContent = r.rating ? "★".repeat(r.rating) : "";
        li.querySelector("p").textContent = r.thoughts || "";
        return li;
      }));
    };
    drawScore();
    if (n.photo) setPhoto(el, p.id, n.photo);
    el.dataset.id = p.id;
    el._refresh = () => {
      if (gone(p)) { el.remove(); return; }
      drawScore(); drawOfficial();
      const ph = notes[p.id]?.photo;
      if (ph && ph !== el._photo) setPhoto(el, p.id, ph);
      el.classList.toggle("done", finished(p));
    };

    const rate = async (patch) => {
      if (!me()) { state.className = "state err"; state.textContent = "Pick your name at the top first."; return; }
      const cur = mineOf(p) || {};
      const body = { by: me(), rating: patch.rating ?? cur.rating ?? 0, thoughts: patch.thoughts ?? cur.thoughts ?? "", ig: patch.ig ?? cur.ig ?? "", frat: patch.frat ?? cur.frat ?? 0, priv: patch.priv ?? cur.priv ?? 0 };
      state.className = "state"; state.textContent = "Saving…";
      try {
        const r = await call(`/rate/${p.id}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
        ratings[p.id] = r.ratings;
        el.classList.toggle("done", finished(p));
        drawScore(); drawOfficial(); refreshCount();
        const mineNow = mineOf(p); if (mineNow?.ig && mineNow.ig !== NONE && document.activeElement !== ig) ig.value = mineNow.ig;
        state.className = "state saved"; state.textContent = "Saved";
      } catch (err) { state.className = "state err"; state.textContent = err.message === "pick your name first" ? "Pick your name at the top first." : "Didn't save. Check your connection."; }
    };
    stars.forEach((b) => b.addEventListener("click", () => { const r = +b.dataset.r === (mineOf(p)?.rating || 0) ? 0 : +b.dataset.r; paint(r); rate({ rating: r }); }));
    th.addEventListener("change", () => rate({ thoughts: th.value.trim() }));
    const saveIg = (value) => rate({ ig: value });
    ig.addEventListener("input", showLink);
    ig.addEventListener("change", () => { ig.value = cleanHandle(ig.value); showLink(); saveIg(ig.value); });
    // a pasted link turns into the handle straight away
    ig.addEventListener("paste", () => setTimeout(() => { ig.value = cleanHandle(ig.value); showLink(); }, 0));
    noig.addEventListener("change", () => { ig.disabled = noig.checked; if (noig.checked) ig.value = ""; showLink(); saveIg(noig.checked ? NONE : ""); });
    el.querySelector(".pic input").addEventListener("change", async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const pic = el.querySelector(".pic"); pic.classList.add("busy");
      try {
        const blob = await shrink(file);
        const r = await call(`/photo/${p.id}`, { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob });
        notes[p.id] = r.note; setPhoto(el, p.id, r.note.photo); refreshCount();
        state.className = "state saved"; state.textContent = "Photo saved";
      } catch { state.className = "state err"; state.textContent = "Photo didn't upload. Try again."; }
      pic.classList.remove("busy"); e.target.value = "";
    });
    return el;
  }
  function setPhoto(el, id, v) {
    const pic = el.querySelector(".pic");
    pic.querySelector("img")?.remove();
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    img.src = `${API}/photo/${id}?t=${encodeURIComponent(token)}&v=${v}`;
    el._photo = v;
    pic.prepend(img); pic.querySelector(".up").textContent = "";
  }
  // phones take 12 megapixel photos: send a 1200px JPEG instead (about 200 KB), sharp enough for a composite
  async function shrink(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
    const src = bmp || await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const w = src.width, h = src.height, k = Math.min(1, 1200 / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
  }

  // ---------- adding a kid, and the check for someone already on the list ----------
  // the same person is often typed differently: a nickname, a typo, the names swapped. names are
  // compared after folding nicknames to one form and allowing a letter or two of difference
  const NICK = [
    ["matthew", "matt", "matty"], ["michael", "mike", "mikey"], ["christopher", "chris", "topher"], ["alexander", "alex", "alec", "xander"],
    ["jacob", "jake"], ["joseph", "joe", "joey"], ["joshua", "josh"], ["anthony", "tony", "ant"], ["andrew", "andy", "drew"],
    ["benjamin", "ben", "benny"], ["thomas", "tom", "tommy"], ["robert", "rob", "robbie", "robby", "bob", "bobby"],
    ["william", "will", "billy", "liam"], ["samuel", "sam", "sammy"], ["daniel", "dan", "danny"], ["nicholas", "nick", "nico"],
    ["nathaniel", "nathan", "nate"], ["zachary", "zach", "zack"], ["david", "dave"], ["jonathan", "jon", "john", "johnny", "jack"],
    ["maximus", "max", "maximilian", "maxwell"], ["giovanni", "gio"], ["edward", "ed", "eddie", "ted"], ["richard", "rich", "rick", "ricky"],
    ["charles", "charlie", "chuck"], ["james", "jim", "jimmy", "jamie"], ["timothy", "tim"], ["patrick", "pat"], ["gabriel", "gabe"],
    ["jeremy", "jerry"], ["kenneth", "ken", "kenny"], ["steven", "stephen", "steve"], ["theodore", "theo", "teddy"], ["vincent", "vince", "vinny"],
  ];
  const CANON = new Map(NICK.flatMap((g) => g.map((n) => [n, g[0]])));
  const fold = (v) => String(v || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
  const canon = (v) => CANON.get(fold(v)) || fold(v);
  // typos between two spellings, where two letters swapped ("ie" for "ei") count as one
  const lev = (a, b) => {
    if (a === b) return 0;
    const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[m][n];
  };
  const close = (a, b) => a === b || (Math.min(a.length, b.length) >= 4 && lev(a, b) <= (Math.max(a.length, b.length) >= 8 ? 2 : 1));
  const firstLike = (a, b) => canon(a) === canon(b) || close(fold(a), fold(b)) || (fold(a).length <= 2 && fold(b).startsWith(fold(a))) || (fold(b).length <= 2 && fold(a).startsWith(fold(b)));
  function lookalikes(first, last, ig) {
    const h = cleanHandle(ig), F = first, L = fold(last);
    const out = [];
    for (const p of roster.pnms) {
      let why = "";
      if (h && (ratings[p.id] || []).some((r) => r.ig === h)) why = "same Instagram";
      else if (close(fold(p.last), L) && firstLike(p.first, F)) why = fold(p.last) === L && canon(p.first) === canon(F) ? "same name" : "very close name";
      else if (close(fold(p.last), fold(F)) && firstLike(p.first, last)) why = "names swapped";
      else if (fold(p.last) === L && L.length >= 5) why = "same last name";
      if (why) out.push({ p, why, rank: ["same Instagram", "same name", "very close name", "names swapped", "same last name"].indexOf(why) });
    }
    // brothers on the rush team are not PNMs: say so if the name is one of them
    for (const g of roster.groups) for (const m of g.members) {
      const [mf, ...ml] = m.split(" ");
      if (ml.length && close(fold(ml.join(" ")), L) && firstLike(mf, F)) out.push({ p: { first: mf, last: ml.join(" "), group: g.n, brother: true }, why: "he's on the rush team", rank: -1 });
    }
    return out.sort((a, b) => a.rank - b.rank).slice(0, 6);
  }

  const dlg = $("#add"), form = $("#add-form"), amsg = $("#add-msg");
  let checked = "";                                  // the name the last check was for: a second press adds him
  const resetAdd = () => { form.reset(); $("#add-matches").hidden = true; amsg.textContent = ""; checked = ""; $("#add-go").textContent = "Check and add"; };
  $("#add-open").addEventListener("click", () => { resetAdd(); dlg.showModal(); form.elements.first.focus(); });
  $("#add-cancel").addEventListener("click", () => dlg.close());
  form.addEventListener("input", () => { if (checked) { checked = ""; $("#add-go").textContent = "Check and add"; $("#add-matches").hidden = true; amsg.textContent = ""; } });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const first = form.elements.first.value.trim(), last = form.elements.last.value.trim(), ig = form.elements.ig.value;
    if (!first || !last) { amsg.textContent = "First and last name, please."; return; }
    if (!me()) { amsg.textContent = "Pick your name at the top first."; return; }
    const key = (first + "|" + last).toLowerCase();
    if (checked !== key) {
      const found = lookalikes(first, last, ig);
      checked = key;
      if (found.length) {
        $("#add-list").replaceChildren(...found.map(({ p, why }) => {
          const li = document.createElement("li");
          li.innerHTML = `<span><b></b><br><small></small></span>`;
          li.querySelector("b").textContent = `${p.first} ${p.last}`;
          li.querySelector("small").textContent = p.brother ? why : `Group ${p.group} · ${why}`;
          if (!p.brother) {
            const b = document.createElement("button"); b.type = "button"; b.textContent = "That's him";
            b.addEventListener("click", () => { dlg.close(); setView("all"); $("#q").value = `${p.first} ${p.last}`; draw(); });
            li.append(b);
          }
          return li;
        }));
        $("#add-matches").hidden = false;
        $("#add-go").textContent = "He's new, add him";
        amsg.textContent = "";
        return;
      }
    }
    $("#add-go").disabled = true; amsg.textContent = "Adding…";
    try {
      const r = await fetch(API + "/add", { method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: JSON.stringify({ first, last, ig, by: me() }) });
      const j = await r.json();
      if (r.status === 409) { amsg.textContent = `${j.kid.first} ${j.kid.last} is already on the list (group ${j.kid.group}).`; return; }
      if (!r.ok) throw new Error(j.error || "failed");
      roster.pnms.push(j.kid);
      if (j.kid.ig) (ratings[j.kid.id] ||= []).push({ by: me(), rating: 0, thoughts: "", ig: j.kid.ig, frat: 0, priv: 0, at: Date.now() });
      amsg.textContent = `Added ${j.kid.first} ${j.kid.last} to group ${j.kid.group}.`;
      draw();
      setTimeout(() => { if (dlg.open) dlg.close(); }, 1400);
    } catch { amsg.textContent = "Didn't add. Check your connection."; }
    finally { $("#add-go").disabled = false; }
  });

  // live: every 30 seconds an open page asks for whatever was saved since its last look (photos, ratings,
  // handles) and updates those cards in place. it does not re-sort, so nothing jumps while someone reads
  async function sync() {
    if (!roster || document.visibilityState !== "visible") return;
    try {
      const d = await call(`/data?since=${synced - 2000}`);
      synced = d.now || Date.now();
      const touched = new Set();
      for (const [id, nn] of Object.entries(d.notes || {})) { notes[id] = nn; touched.add(id); }
      for (const [id, list] of Object.entries(d.ratings || {})) {
        const cur = ratings[id] || [];
        for (const r of list) { const i = cur.findIndex((x) => x.by === r.by); if (i >= 0) cur[i] = r; else cur.push(r); }
        ratings[id] = cur; touched.add(id);
      }
      const fresh = (d.added || []).filter((k) => !roster.pnms.some((p) => p.id === k.id));
      if (fresh.length) {
        roster.pnms.push(...fresh);
        // a new kid shows up without pulling the page out from under someone who is typing
        if (!document.activeElement?.matches("input, textarea")) { draw(); return; }
      }
      if (!touched.size) return;
      document.querySelectorAll(".card").forEach((c) => { if (touched.has(c.dataset.id)) c._refresh?.(); });
      refreshCount();
    } catch {}
  }
  setInterval(sync, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });

  if (token) open().catch(() => { store.del("rush-token"); location.reload(); });
})();
</script>
</body>
</html>
