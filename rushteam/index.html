<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FIJI</title>
<script>
// the sign-in page is moving to a new address: go there once it answers, else to the current one
(async () => {
  const next = "https://fiji-portal.asufiji.workers.dev/", now = "https://fiji-portal.maniforoughi2.workers.dev/";
  try { await fetch(next, { mode: "no-cors", cache: "no-store" }); location.replace(next); } catch { location.replace(now); }
})();
</script>
</head>
